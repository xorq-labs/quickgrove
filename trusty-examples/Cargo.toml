[package]
name = "examples"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "datafusion_udf"
path = "datafusion_udf.rs"

[[bin]]
name = "single_prediction"
path = "single_prediction.rs"

[[bin]]
name = "airline_prediction"
path = "airline_prediction.rs"

[dependencies]
arrow = { version = "57.1.0", features = ["pyarrow"] }
serde_json = "1.0"
datafusion = { version = "51.0.0" }
datafusion-common = "51.0.0"
datafusion-expr = "51.0.0"
trusty = { path = ".." }
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
